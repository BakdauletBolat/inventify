# Конфиг для nginx НА ХОСТЕ (не в docker) нового сервера.
# Ставится рядом с kainar-marketplace.conf и его не затрагивает.
#
# Установка:
#   sudo cp docker/host-nginx/back-kaynar.conf /etc/nginx/sites-available/back-kaynar.conf
#   sudo ln -s /etc/nginx/sites-available/back-kaynar.conf /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
#   sudo certbot --nginx -d back-kaynar.kz      # сам допишет сюда блок 443 и редирект с 80
#
# Файл намеренно только на :80 — certbot добавит SSL сам, как он это сделал
# для kaynaravto.kz. Писать блок 443 руками до выпуска сертификата нельзя:
# nginx не стартует, если ssl_certificate указывает на несуществующий файл,
# а это уронит и работающий маркетплейс.

upstream inventify_web {
    server 127.0.0.1:8000;
    keepalive 8;
}

server {
    listen 80;
    listen [::]:80;
    # www.back-kaynar.kz — CNAME на back-kaynar.kz, поэтому отдельной A-записи
    # у него нет и при переключении DNS он едет за основным доменом.
    server_name back-kaynar.kz www.back-kaynar.kz;
    server_tokens off;

    client_max_body_size 20M;
    charset utf-8;

    gzip on;
    gzip_min_length 1000;
    gzip_proxied expired no-cache no-store private auth;
    gzip_types text/plain text/css application/json application/javascript
               application/x-javascript text/xml application/xml text/javascript;

    # Для выпуска и продления сертификата хостовым certbot
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # Статику отдаёт nginx напрямую, минуя gunicorn.
    # Путь совпадает с bind-mount из docker-compose.prod.yml.
    location /static/ {
        alias /var/www/inventify/staticfiles/;
        expires 30d;
        access_log off;
    }

    # /media/ здесь нет намеренно: файлы отдаёт S3 PS.KZ (USE_S3_MEDIA=1)

    location / {
        proxy_pass http://inventify_web;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        proxy_read_timeout 120s;
        proxy_redirect off;
    }
}
