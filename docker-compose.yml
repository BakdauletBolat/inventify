version: '3'

services:
  web:
    build: .
    restart: unless-stopped
    command: poetry run gunicorn inventify.wsgi:application --bind 0.0.0.0:8000 --workers=4 --timeout 120
    volumes:
      - static_volume:/usr/src/app/staticfiles
      - media_volume:/usr/src/app/media
    expose:
      - 8000
    env_file:
      - .env
    depends_on:
      - db
  #      - db-drf-api-logger
  #      - es

  db:
    image: postgres:13.0-alpine
    restart: unless-stopped
    volumes:
      - postgres_data:/var/lib/postgresql/data/
    env_file:
      - .env
    environment:
      POSTGRES_USER: ${SQL_USER}
      POSTGRES_PASSWORD: ${SQL_PASSWORD}
      POSTGRES_DB: ${SQL_DATABASE}
    ports:
      - "${SQL_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${SQL_USER} -d $${SQL_DATABASE}"]
      interval: 10s
      timeout: 5s
      retries: 5

  nginx:
    build: ./docker/prod/nginx/
    restart: always
    volumes:
      - static_volume:/usr/src/app/staticfiles
      - media_volume:/usr/src/app/media
      - ./docker/certbot/conf:/etc/letsencrypt:ro
      - ./docker/certbot/www:/var/www/certbot:ro
    ports:
      - '80:80'
      - '443:443'
    depends_on:
      - web

  certbot:
    image: certbot/certbot
    container_name: certbot
    volumes:
      - ./docker/certbot/conf:/etc/letsencrypt:rw
      - ./docker/certbot/www:/var/www/certbot:rw
#    command: certonly --webroot --webroot-path=/var/www/certbot/ --email djars500@gmail.com --agree-tos --no-eff-email -d back-kaynar.kz -d www.back-kaynar.kz
    depends_on:
      - nginx

  #  db-drf-api-logger:
  #    image: postgres:13.0-alpine
  #    volumes:
  #      - postgres_data_drf:/var/lib/postgresql/data/
  #    env_file:
  #      - .env
  #    environment:
  #      POSTGRES_USER: ${SQL_USER_DRF}
  #      POSTGRES_PASSWORD: ${SQL_PASSWORD_DRF}
  #      POSTGRES_DB: ${SQL_DATABASE_DRF}
  #    ports:
  #      - "7432:5432"
  #
  redis:
    image: redis:alpine
    restart: unless-stopped
    ports:
      - '6381:6379'
    depends_on:
      - web
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  celery-worker:
    build: ./
    restart: unless-stopped
    command: poetry run celery -A inventify worker --beat -l INFO --scheduler django --loglevel=info --concurrency=3 --max-tasks-per-child=100
    depends_on:
      - redis
      - db
    env_file:
      - .env
    volumes:
      - media_volume:/usr/src/app/media


  flower:
    image: mher/flower:0.9.7
    restart: unless-stopped
    command: [ 'flower', '--broker=redis://redis:6379', '--port=5555' ]
    ports:
      - "5557:5555"
    depends_on:
      - redis


#  es:
#    image: elasticsearch:7.8.1
#    environment:
#      - discovery.type=single-node
#    ports:
#      - "9200:9200"

volumes:
  postgres_data:
  #  postgres_data_drf:
  static_volume:
  media_volume:
  redis_data:

